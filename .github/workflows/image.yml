name: Image

# NeatOps fork: the two images the NeatOps platform runs (Kubernetes, neatops/platform), built from the same commit as
# upstream requires, for amd64, published on GHCR and signed keyless with this workflow's identity, which the
# clusters' Kyverno checks. The platform deploys digests, never tags.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write  # push to ghcr.io/neatops/hivemind* (main only)
      id-token: write  # cosign keyless signature (main only)
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ghcr.io/neatops/hivemind
            dockerfile: Dockerfile
          - image: ghcr.io/neatops/hivemind-graph-memory
            dockerfile: services/graph-memory/Dockerfile
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Both images build from the repository root (Graph Memory installs the shared src/hivemind_inference).
      # A pull request builds them; main also pushes them.
      - name: Build, and push on main
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ matrix.image }}:${{ github.sha }}
          provenance: true
          sbom: true

      - name: Install cosign
        if: github.event_name == 'push'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4

      - name: Sign the image keyless
        if: github.event_name == 'push'
        env:
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Record the digest
        if: github.event_name == 'push'
        env:
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "### ${IMAGE}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
